name: Dockyard source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libldap2-dev libsasl2-dev libarchive-tools
      - run: python -m pip install -r packaging/requirements.txt
      - run: python -m pip install pycdlib && python scripts/make-test-iso.py
      - run: python -m unittest discover -s tests -v
      - run: node --check web/static/js/dockyard.js
